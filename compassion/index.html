<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How a hierarchy puts a tail in an election</title>
<style>
:root {
  --bg:        #0d1016;
  --surface:   #161b24;
  --border:    #262e3c;
  --text:      #c9d2e0;
  --muted:     #6b7789;
  --accent:    #d8a24a;

  --main:      #e66767;
  --opp:       #3987e5;
  --mid:       #6a6f78;
  --sweep:     #199e70;
  --edge:      #39414f;
  --grid:      #222a36;

  --font: system-ui, 'Segoe UI', sans-serif;
  --mono: 'SF Mono', 'Fira Code', Consolas, monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 var(--font);
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* ── Left: canvases ─────────────────────────────────────────────────── */

#stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }

#net-wrap { flex: 1; position: relative; min-height: 0; }
#net { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

#panels {
  height: 240px;
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 1px;
  background: var(--border);
  border-top: 1px solid var(--border);
}

.panel { background: var(--bg); position: relative; min-width: 0; }
.panel canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.panel h2 {
  position: absolute; top: 6px; left: 8px;
  font-size: 11px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; color: var(--muted);
  pointer-events: none; z-index: 1;
}
.panel .readout {
  position: absolute; top: 6px; right: 8px;
  font: 11px var(--mono); color: var(--accent); text-align: right;
  pointer-events: none; z-index: 1;
}

/* ── Right: controls ────────────────────────────────────────────────── */

#side {
  width: 290px;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow-y: auto;
}

#side header { padding: 12px 14px 8px; border-bottom: 1px solid var(--border); }
#side h1 { font-size: 17px; letter-spacing: .06em; }
#side header p { color: var(--muted); font-size: 11px; margin-top: 3px; }

.group { padding: 10px 14px; border-bottom: 1px solid var(--border); }
.group > h3 {
  font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--muted); margin-bottom: 8px;
}

.ctl { margin-bottom: 9px; }
.ctl label { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 2px; }
.ctl label span:last-child { font-family: var(--mono); color: var(--accent); }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); }

.ctl.hero label { font-size: 13px; font-weight: 600; }
.ctl.hero label span:last-child { font-size: 15px; }
.ctl.hero input[type=range] { height: 22px; }

.meter { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.meter > div { height: 100%; background: linear-gradient(90deg, var(--main), var(--accent), var(--opp)); }

button {
  font: inherit; font-size: 12px;
  background: var(--border); color: var(--text);
  border: 1px solid transparent; border-radius: 3px;
  padding: 5px 9px; cursor: pointer;
}
button:hover { border-color: var(--muted); }
button.on { background: var(--accent); color: #17130a; }
button.wide { width: 100%; }

.row { display: flex; gap: 5px; flex-wrap: wrap; }
.row > button { flex: 1; }

.check { display: flex; align-items: center; gap: 6px; font-size: 11px; margin-bottom: 6px; }
.check input { accent-color: var(--accent); }

.stat { display: flex; justify-content: space-between; font-size: 11px; padding: 1px 0; }
.stat span:last-child { font-family: var(--mono); color: var(--text); }

/* ── Rules overlay ──────────────────────────────────────────────────── */

#rules {
  position: fixed; inset: 0;
  background: rgba(5,7,11,.86);
  display: none; align-items: center; justify-content: center;
  z-index: 40;
}
#rules.open { display: flex; }
#rules-box {
  background: var(--surface);
  border: 1px solid var(--border);
  width: min(760px, 92vw); max-height: 88vh;
  display: flex; flex-direction: column;
}
#rules-head {
  display: flex; align-items: baseline; gap: 10px;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
}
#rules-head h2 { font-size: 15px; }
#rules-head p { color: var(--muted); font-size: 11px; flex: 1; }
#rules-list { overflow-y: auto; padding: 4px 0; }

.rule { display: grid; grid-template-columns: 116px 1fr; gap: 12px; padding: 7px 16px; }
.rule:nth-child(odd) { background: rgba(255,255,255,.017); }
.rule-name { font-weight: 600; font-size: 12px; }
.rule-text { font-size: 12px; color: var(--text); }
.rule-text code { font-family: var(--mono); font-size: 11px; color: var(--accent); }
.rule-vals { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 2px; }

/* ── Debug panel ────────────────────────────────────────────────────── */

#debug-panel {
  position: fixed; right: 0; bottom: 0; width: 460px; max-height: 50vh;
  background: var(--surface); border: 1px solid var(--border);
  display: none; flex-direction: column; z-index: 50;
  font-family: var(--mono); font-size: 11px;
}
#debug-panel.open { display: flex; }
#debug-header { display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--border); }
#debug-title { flex: 1; font-weight: 600; }
#debug-log { overflow-y: auto; padding: 4px 8px; }
.dl-entry { display: flex; gap: 6px; padding: 1px 0; }
.dl-time { color: var(--muted); }
.dl-level { width: 40px; color: var(--muted); }
.dl-error .dl-msg { color: var(--main); }
.dl-warn  .dl-msg { color: var(--accent); }
.dl-empty { color: var(--muted); padding: 6px 0; }
</style>
</head>
<body>


<div id="stage">
  <div id="net-wrap"><canvas id="net"></canvas></div>
  <div id="panels">
    <div class="panel">
      <h2>Votes by turnout</h2>
      <div class="readout" id="ro-hist"></div>
      <canvas id="hist"></canvas>
    </div>
    <div class="panel">
      <h2>Turnout / share</h2>
      <canvas id="scatter"></canvas>
    </div>
    <div class="panel">
      <h2>Compassion sweep</h2>
      <div class="readout" id="ro-sweep"></div>
      <canvas id="sweep"></canvas>
    </div>
  </div>
</div>

<aside id="side">
  <header>
    <h1>COMPASSION</h1>
    <p>Cells drain their weaker neighbours. Nobody cheats at the ballot; the tail is loyalty.</p>
  </header>

  <div class="group">
    <div class="ctl hero">
      <label for="p-compassion"><span>Compassion</span><span id="v-compassion"></span></label>
      <input type="range" id="p-compassion">
      <div class="meter"><div id="m-compassion"></div></div>
    </div>
    <div class="row">
      <button id="btn-rules">Rules</button>
      <button id="btn-sweep">Sweep compassion</button>
    </div>
  </div>

  <div class="group">
    <h3>Election</h3>
    <label class="check"><input type="checkbox" id="opt-control" checked>
      Overlay the counterfactual where everyone votes for themselves</label>
    <div class="row"><button id="btn-vote" class="wide">Hold an election now</button></div>
    <div id="stats"></div>
  </div>

  <div class="group">
    <h3>Presets</h3>
    <div class="row">
      <button data-preset="compassionate">Compassionate</button>
      <button data-preset="ruthless">Ruthless</button>
      <button data-preset="purge">Over-repressive</button>
    </div>
    <div class="ctl" style="margin-top:8px">
      <label for="p-speed"><span>Speed</span><span id="v-speed"></span></label>
      <input type="range" id="p-speed" min="1" max="120" step="1" value="10">
    </div>
    <div class="ctl">
      <label for="p-draw"><span>Draw every</span><span id="v-draw"></span></label>
      <input type="range" id="p-draw" min="1" max="30" step="1" value="1">
    </div>
    <div class="row">
      <button id="btn-pause">Pause</button>
      <button id="btn-reset">Reset</button>
      <button id="btn-debug">DBG</button>
    </div>
  </div>

  <div class="group" id="g-model"><h3>Model</h3></div>
  <div class="group" id="g-election"><h3>Election</h3></div>
</aside>

<div id="rules">
  <div id="rules-box">
    <div id="rules-head">
      <h2>Every rule this page runs</h2>
      <p>values are live</p>
      <button id="rules-close">✕</button>
    </div>
    <div id="rules-list"></div>
  </div>
</div>

<script type="module">
import { CAP, WORLD_W, WORLD_H, BINS, P, RULES, EP, ELECTION_RULES, Model, runElection, blocVote, radius, clamp, dx, dy } from './model.js';
// ============================================================================
// Rendering
// ============================================================================

/**
 * Canvas rendering. Colours come from the stylesheet, so the palette has one home.
 *
 * The diverging alignment scale is the validated blue/red pair with a grey midpoint;
 * nodes are bucketed by alignment and each bucket drawn as one path, which keeps the
 * whole network to a couple of dozen fill calls.
 */


const BUCKETS = 21;

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function hex(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mix(a, b, t) {
  return `rgb(${Math.round(a[0] + (b[0] - a[0]) * t)},${Math.round(a[1] + (b[1] - a[1]) * t)},${Math.round(a[2] + (b[2] - a[2]) * t)})`;
}

class View {
  constructor() {
    this.main = hex(css('--main'));
    this.opp = hex(css('--opp'));
    this.mid = hex(css('--mid'));
    this.sweepColor = css('--sweep');
    this.textMuted = css('--muted');
    this.gridColor = css('--grid');
    this.edge = css('--edge');

    /** Alignment 0..1 straight into the red and blue channels; green only desaturates the
     *  midpoint, which would otherwise read as vivid magenta rather than as "uncommitted". */
    this.ramp = Array.from({ length: BUCKETS }, (_, k) => {
      const a = k / (BUCKETS - 1);
      const g = Math.round(90 * (1 - Math.abs(2 * a - 1)));
      return `rgb(${Math.round(255 * a)},${g},${Math.round(255 * (1 - a))})`;
    });

    this.canvases = {};
    for (const id of ['net', 'hist', 'scatter', 'sweep']) {
      const el = document.getElementById(id);
      this.canvases[id] = { el, ctx: el.getContext('2d', { alpha: false }) };
    }
    this.onResize = null;
    this.resize();
    window.addEventListener('resize', () => { this.resize(); this.onResize?.(); });
  }

  resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    for (const k in this.canvases) {
      const { el } = this.canvases[k];
      const r = el.getBoundingClientRect();
      el.width = Math.max(1, Math.round(r.width * dpr));
      el.height = Math.max(1, Math.round(r.height * dpr));
      this.canvases[k].w = r.width;
      this.canvases[k].h = r.height;
      this.canvases[k].ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }

  clear(key) {
    const { ctx, w, h } = this.canvases[key];
    ctx.fillStyle = css('--bg');
    ctx.fillRect(0, 0, w, h);
    return this.canvases[key];
  }

  drawNetwork(model) {
    const { ctx, w, h } = this.clear('net');
    const s = Math.min(w / WORLD_W, h / WORLD_H);
    const ox = (w - WORLD_W * s) / 2, oy = (h - WORLD_H * s) / 2;
    const { x, y, e, a, alive } = model;

    ctx.lineWidth = 1;
    ctx.strokeStyle = this.edge;
    ctx.beginPath();
    const heads = new Path2D();
    for (let i = 0; i < CAP; i++) {
      if (!alive[i]) continue;
      const p = model.parentOf(i);
      if (p < 0) continue;
      const giver = e[i] < e[p] ? i : p;
      const taker = giver === i ? p : i;
      const gx = ox + x[giver] * s, gy = oy + y[giver] * s;
      const sx = dx(x[giver], x[taker]) * s, sy = dy(y[giver], y[taker]) * s;
      ctx.moveTo(gx, gy);
      ctx.lineTo(gx + sx * 0.62, gy + sy * 0.62);
      heads.rect(gx + sx - 1, gy + sy - 1, 2, 2);
    }
    ctx.stroke();
    ctx.fillStyle = this.edge;
    ctx.fill(heads);

    const paths = Array.from({ length: BUCKETS }, () => new Path2D());
    let spoiled = 0;
    for (let i = 0; i < CAP; i++) {
      if (!alive[i]) continue;
      const cx = ox + x[i] * s, cy = oy + y[i] * s;
      if (!Number.isFinite(cx + cy + a[i] + e[i])) { spoiled++; continue; }
      const k = Math.round(clamp(a[i], 0, 1) * (BUCKETS - 1));
      const r = Math.max(0.7, radius(e[i]) * s);
      paths[k].moveTo(cx + r, cy);
      paths[k].arc(cx, cy, r, 0, Math.PI * 2);
    }
    for (let k = 0; k < BUCKETS; k++) {
      ctx.fillStyle = this.ramp[k];
      ctx.fill(paths[k]);
    }
    if (spoiled && !this.warned) { this.warned = true; dbg.error(`${spoiled} cells are not finite`); }
  }

  /** Votes over turnout, one filled curve per party, with the counterfactual as an outline. */
  drawHistogram(result, control) {
    const { ctx, w, h } = this.clear('hist');
    const pad = { l: 34, r: 10, t: 30, b: 24 };
    const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
    let max = 1e-9;
    for (let b = 0; b < BINS; b++) max = Math.max(max, result.main[b], result.opp[b]);
    if (control) for (let b = 0; b < BINS; b++) max = Math.max(max, control.main[b], control.opp[b]);

    ctx.strokeStyle = this.gridColor;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let t = 0; t <= 1.0001; t += 0.25) {
      const px = Math.round(pad.l + t * iw) + 0.5;
      ctx.moveTo(px, pad.t); ctx.lineTo(px, pad.t + ih);
    }
    ctx.stroke();

    const curve = (arr, fill, stroke, dashed) => {
      ctx.beginPath();
      for (let b = 0; b < BINS; b++) {
        const px = pad.l + (b + 0.5) / BINS * iw;
        const py = pad.t + ih - (arr[b] / max) * ih;
        b === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      if (fill) {
        ctx.lineTo(pad.l + iw, pad.t + ih);
        ctx.lineTo(pad.l, pad.t + ih);
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
      }
      ctx.setLineDash(dashed ? [3, 3] : []);
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.setLineDash([]);
    };

    curve(result.opp, 'rgba(57,135,229,.22)', css('--opp'), false);
    curve(result.main, 'rgba(230,103,103,.22)', css('--main'), false);
    if (control) curve(control.main, null, css('--main'), true);

    ctx.fillStyle = this.textMuted;
    ctx.font = '10px system-ui';
    ctx.textAlign = 'center';
    for (let t = 0; t <= 1.0001; t += 0.25) {
      ctx.fillText(`${Math.round(t * 100)}%`, pad.l + t * iw, h - 7);
    }
    ctx.save();
    ctx.translate(11, pad.t + ih / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center';
    ctx.fillText('votes', 0, 0);
    ctx.restore();

    this.legend(ctx, pad.l + iw - 148, pad.t + 12, [
      [css('--main'), 'incumbent'],
      [css('--opp'), 'challenger'],
    ]);
  }

  drawScatter(result) {
    const { ctx, w, h } = this.clear('scatter');
    const pad = { l: 28, r: 10, t: 26, b: 22 };
    const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;

    ctx.strokeStyle = this.gridColor;
    ctx.strokeRect(pad.l + 0.5, pad.t + 0.5, iw, ih);

    ctx.fillStyle = 'rgba(230,103,103,.5)';
    for (let k = 0; k < result.points; k++) {
      const tx = result.scatter[2 * k], sy = result.scatter[2 * k + 1];
      ctx.fillRect(pad.l + tx * iw - 0.75, pad.t + ih - sy * ih - 0.75, 1.5, 1.5);
    }

    ctx.fillStyle = this.textMuted;
    ctx.font = '10px system-ui';
    ctx.textAlign = 'left';
    ctx.fillText('turnout →', pad.l, h - 7);
    ctx.save();
    ctx.translate(10, pad.t + ih / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center';
    ctx.fillText('incumbent share', 0, 0);
    ctx.restore();
  }

  /** Administrative share against compassion: the claim the page exists to make. */
  drawSweep(points, live) {
    const { ctx, w, h } = this.clear('sweep');
    const pad = { l: 32, r: 12, t: 26, b: 22 };
    const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;

    ctx.strokeStyle = this.gridColor;
    ctx.strokeRect(pad.l + 0.5, pad.t + 0.5, iw, ih);

    ctx.fillStyle = this.textMuted;
    ctx.font = '10px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('compassion →', pad.l + iw / 2, h - 7);

    if (points.length === 0) {
      ctx.fillText('press Sweep compassion', pad.l + iw / 2, pad.t + ih / 2);
      return;
    }

    const px = c => pad.l + c * iw;
    const py = v => pad.t + ih - clamp(v / 0.5, 0, 1) * ih;

    ctx.beginPath();
    points.forEach((p, k) => (k === 0 ? ctx.moveTo(px(p.c), py(p.admin)) : ctx.lineTo(px(p.c), py(p.admin))));
    ctx.strokeStyle = this.sweepColor;
    ctx.lineWidth = 2;
    ctx.stroke();

    const last = points[points.length - 1];
    ctx.fillStyle = this.sweepColor;
    ctx.beginPath();
    ctx.arc(px(last.c), py(last.admin), 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.textAlign = last.c > 0.5 ? 'right' : 'left';
    ctx.fillText('bloc vote', px(last.c) + (last.c > 0.5 ? -8 : 8), py(last.admin) - 6);

    if (live) {
      ctx.strokeStyle = 'rgba(255,255,255,.18)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(px(live), pad.t);
      ctx.lineTo(px(live), pad.t + ih);
      ctx.stroke();
    }
  }

  legend(ctx, x, y, items) {
    ctx.font = '10px system-ui';
    ctx.textAlign = 'left';
    let cx = x;
    for (const [color, label] of items) {
      ctx.fillStyle = color;
      ctx.fillRect(cx, y - 4, 7, 7);
      ctx.fillStyle = this.textMuted;
      ctx.fillText(label, cx + 11, y + 2);
      cx += 18 + ctx.measureText(label).width;
    }
  }
}

// ============================================================================
// The rules panel
// ============================================================================

/**
 * The rules panel, rendered from the same parameter objects the model reads so the text
 * cannot describe a model other than the one running.
 */


function initRules() {
  const overlay = document.getElementById('rules');
  const list = document.getElementById('rules-list');

  document.getElementById('btn-rules').onclick = open;
  document.getElementById('rules-close').onclick = close;
  overlay.onclick = e => { if (e.target === overlay) close(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

  function open() { render(); overlay.classList.add('open'); }
  function close() { overlay.classList.remove('open'); }

  function render() {
    list.innerHTML = [
      section('Model', RULES, P),
      section('Election', ELECTION_RULES, EP),
    ].join('');
  }

  function section(title, rules, params) {
    return `<div class="rule"><div class="rule-name" style="color:var(--accent)">${title}</div><div></div></div>` +
      rules.map(r => {
        const vals = r.keys
          .filter(k => params[k])
          .map(k => `${params[k].label} ${fmt(params[k].v)}`)
          .join(' · ');
        return `<div class="rule"><div class="rule-name">${r.name}</div>` +
          `<div><div class="rule-text">${r.text()}</div>` +
          (vals ? `<div class="rule-vals">${vals}</div>` : '') + '</div></div>';
      }).join('');
  }

  function fmt(v) {
    if (v === 0 || v === 1) return String(v);
    return Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 1 ? v.toFixed(2) : v.toFixed(3);
  }

  return { open };
}

// ============================================================================
// Persistence
// ============================================================================

/** Config — stored in localStorage under a per-sketch key. */
class Config {
  constructor(key) {
    this.key = key;
  }

  load() {
    const raw = localStorage.getItem(this.key);
    return raw ? JSON.parse(raw) : null;
  }

  save(cfg) {
    localStorage.setItem(this.key, JSON.stringify(cfg));
  }

  clear() {
    localStorage.removeItem(this.key);
  }
}

// ============================================================================
// Debug logger and panel
// ============================================================================

/** Client-side debug logger and panel. Toggle with Ctrl+Shift+D, or the DBG button. */

const MAX_ENTRIES = 300;

class DebugLogger {
  constructor() {
    this._entries = [];
    this._meta = {};
    this._listeners = [];

    window.addEventListener('error', e => {
      this.error(`Uncaught: ${e.message}`, { file: e.filename, line: e.lineno });
    });
    window.addEventListener('unhandledrejection', e => {
      this.error(`Unhandled rejection: ${e.reason?.message ?? e.reason}`);
    });

    const origError = console.error.bind(console);
    console.error = (...a) => { this._push('error', '[console] ' + a.join(' ')); origError(...a); };
  }

  info(msg, data) { this._push('info', msg, data); }
  warn(msg, data) { this._push('warn', msg, data); }
  error(msg, data) { this._push('error', msg, data); }

  setMeta(meta) { this._meta = meta; }
  clear() { this._entries = []; this._notify(); }
  getEntries() { return this._entries; }
  onChange(fn) { this._listeners.push(fn); }

  report() {
    return [
      '=== debug report ===',
      `Time: ${new Date().toISOString()}`,
      ...Object.entries(this._meta).map(([k, v]) => `${k}: ${v}`),
      '',
      ...this._entries.map(e => `[${e.time}] ${e.level.padEnd(5)} ${e.msg}${e.data ? ' ' + JSON.stringify(e.data) : ''}`),
    ].join('\n');
  }

  _push(level, msg, data) {
    this._entries.unshift({ level, msg, data: data ?? null, time: new Date().toTimeString().slice(0, 8) });
    if (this._entries.length > MAX_ENTRIES) this._entries.pop();
    this._notify();
  }

  _notify() { this._listeners.forEach(fn => fn()); }
}

const dbg = new DebugLogger();

function initDebugPanel() {
  const panel = document.createElement('div');
  panel.id = 'debug-panel';
  panel.innerHTML = `
    <div id="debug-header">
      <span id="debug-title">Debug</span>
      <button id="debug-copy">Copy</button>
      <button id="debug-clear">Clear</button>
      <button id="debug-close">✕</button>
    </div>
    <div id="debug-log"></div>`;
  document.body.appendChild(panel);

  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'd') toggle();
  });
  document.getElementById('debug-close').onclick = () => panel.classList.remove('open');
  document.getElementById('debug-clear').onclick = () => dbg.clear();
  document.getElementById('debug-copy').onclick = () => navigator.clipboard.writeText(dbg.report());

  dbg.onChange(render);

  function render() {
    if (!panel.classList.contains('open')) return;
    const e = dbg.getEntries();
    document.getElementById('debug-log').innerHTML = e.length === 0
      ? '<div class="dl-empty">No entries.</div>'
      : e.map(x => `<div class="dl-entry dl-${x.level}"><span class="dl-time">${x.time}</span>` +
          `<span class="dl-level">${x.level}</span><span class="dl-msg">${esc(x.msg)}` +
          `${x.data ? ' ' + esc(JSON.stringify(x.data)) : ''}</span></div>`).join('');
  }

  function toggle() { panel.classList.toggle('open'); render(); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  return { toggle };
}

// ============================================================================
// Wiring: loop, controls, presets, sweep
// ============================================================================

/** Wiring: the loop, the controls, the presets and the compassion sweep. */






const ELECTION_EVERY = 6;

/** Bump whenever a parameter's meaning or range changes, so stored values cannot outlive it. */
const SCHEMA = 2;

const PRESETS = {
  compassionate: { compassion: 0.78, lambda: 0.25, theta: 0.6, surcharge: 0.35, influenceK: 0.12 },
  ruthless:      { compassion: 0.10, lambda: 0.25, theta: 0.6, surcharge: 0.35, influenceK: 0.12 },
  purge:         { compassion: 0.04, lambda: 0.25, theta: 0.28, surcharge: 1.4, influenceK: 0.25 },
};

const config = new Config('compassion');
const model = new Model();
const view = new View();
const debugPanel = initDebugPanel();
initRules();

view.onResize = () => {
  view.drawNetwork(model);
  if (result) { view.drawHistogram(result, control); view.drawScatter(result); }
  view.drawSweep(sweepPoints, P.compassion.v);
};

const speedInput = document.getElementById('p-speed');
const speedLabel = document.getElementById('v-speed');
speedInput.oninput = () => { speedLabel.textContent = `${speedInput.value}\u00d7`; };
speedInput.oninput();

const drawInput = document.getElementById('p-draw');
const drawLabel = document.getElementById('v-draw');
drawInput.oninput = () => {
  const n = Number(drawInput.value);
  drawLabel.textContent = n === 1 ? 'every frame' : `${n} frames`;
};
drawInput.oninput();

const rate = { steps: 0, frames: 0, since: performance.now(), stepsPerSec: 0, fps: 0 };

let paused = false;
let sweepJob = null;
let sweepPoints = [];
let result = null;
let control = null;
let sinceVote = 0;
let electionSeed = 1;

buildControls(document.getElementById('g-model'), P, k => k !== 'compassion' && k !== 'drag');
buildControls(document.getElementById('g-election'), EP, () => true);
bindHero();
restore();
hold();

document.getElementById('btn-vote').onclick = hold;
document.getElementById('btn-pause').onclick = e => {
  paused = !paused;
  e.target.textContent = paused ? 'Resume' : 'Pause';
  e.target.classList.toggle('on', paused);
};
document.getElementById('btn-reset').onclick = () => { model.reset(); sweepPoints = []; hold(); };
document.getElementById('btn-debug').onclick = () => debugPanel.toggle();
document.getElementById('btn-sweep').onclick = startSweep;
document.getElementById('opt-control').onchange = hold;
for (const b of document.querySelectorAll('[data-preset]')) {
  b.onclick = () => applyPreset(b.dataset.preset);
}

/** One slider per parameter, so a rule and its control cannot disagree. */
function buildControls(host, params, keep) {
  for (const key in params) {
    if (!keep(key)) continue;
    const p = params[key];
    const ctl = document.createElement('div');
    ctl.className = 'ctl';
    ctl.innerHTML = `<label for="x-${key}"><span>${p.label}</span><span id="xv-${key}"></span></label>` +
      `<input type="range" id="x-${key}" min="${p.min}" max="${p.max}" step="${p.step}">`;
    host.appendChild(ctl);
    const input = ctl.querySelector('input');
    input.value = p.v;
    setLabel(key, p.v);
    input.oninput = () => {
      p.v = Number(input.value);
      setLabel(key, p.v);
      persist();
    };
  }
}

function setLabel(key, v) {
  const el = document.getElementById(`xv-${key}`);
  if (el) el.textContent = fmt(v);
}

function bindHero() {
  const input = document.getElementById('p-compassion');
  const p = P.compassion;
  input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.v;
  input.oninput = () => {
    p.v = Number(input.value);
    model.applyCompassion();
    syncHero();
    persist();
  };
  syncHero();
}

function syncHero() {
  document.getElementById('p-compassion').value = P.compassion.v;
  document.getElementById('v-compassion').textContent = P.compassion.v.toFixed(2);
  document.getElementById('m-compassion').style.width = `${P.compassion.v * 100}%`;
}

function applyPreset(name) {
  for (const [k, v] of Object.entries(PRESETS[name])) P[k].v = v;
  model.applyCompassion();
  syncHero();
  for (const key in P) {
    const input = document.getElementById(`x-${key}`);
    if (input) { input.value = P[key].v; setLabel(key, P[key].v); }
  }
  persist();
  hold();
  dbg.info(`preset ${name}`);
}

function hold() {
  electionSeed++;
  result = runElection(model, { loyalty: true, seed: electionSeed });
  control = document.getElementById('opt-control').checked
    ? runElection(model, { loyalty: false, seed: electionSeed })
    : null;
  sinceVote = 0;
  view.drawHistogram(result, control);
  view.drawScatter(result);
  view.drawSweep(sweepPoints, P.compassion.v);
  document.getElementById('ro-hist').textContent =
    `incumbent ${(result.mainShare * 100).toFixed(1)}% · bloc vote ${(result.blocShare * 100).toFixed(1)}%`;
  renderStats();
}

function renderStats() {
  const s = model.stats();
  document.getElementById('stats').innerHTML = [
    ['Stations', result ? result.stations : 0],
    ['Incumbent by preference', `${(100 * s.main / Math.max(1, s.live)).toFixed(0)}%`],
    ['Incumbent reported', result ? `${(result.mainShare * 100).toFixed(1)}%` : '—'],
    ['Bloc vote', result ? `${(result.blocShare * 100).toFixed(1)}%` : '—'],
    ['Captured cells', result ? `${(100 * result.captured / Math.max(1, result.stations)).toFixed(0)}%` : '—'],
    ['Largest cell', s.eMax.toFixed(0)],
    ['Destroyed', s.destroyed],
    ['Divided', s.divided],
    ['Sim steps / s', rate.stepsPerSec],
    ['Frames drawn / s', Math.round(rate.fps / Number(drawInput.value))],
  ].map(([k, v]) => `<div class="stat"><span>${k}</span><span>${v}</span></div>`).join('');
}

/** Step compassion down from 1, letting the model settle at each stop before voting. */
function startSweep() {
  if (sweepJob) { sweepJob = null; document.getElementById('btn-sweep').classList.remove('on'); return; }
  sweepPoints = [];
  sweepJob = { c: 1.0, settle: 0, restore: P.compassion.v };
  document.getElementById('btn-sweep').classList.add('on');
  dbg.info('sweep started');
}

function advanceSweep() {
  const job = sweepJob;
  if (job.settle === 0) {
    P.compassion.v = job.c;
    model.applyCompassion();
    syncHero();
  }
  const chunk = Math.max(10, Number(speedInput.value) * 3);
  for (let k = 0; k < chunk; k++) model.step();
  job.settle += chunk;
  if (job.settle < 150) return;

  const r = runElection(model, { loyalty: true, seed: 99 });
  sweepPoints.push({ c: job.c, admin: r.blocShare });
  sweepPoints.sort((a, b) => a.c - b.c);
  view.drawSweep(sweepPoints, P.compassion.v);
  document.getElementById('ro-sweep').textContent = `c=${job.c.toFixed(2)} · ${(r.blocShare * 100).toFixed(1)}%`;

  job.settle = 0;
  job.c = Math.round((job.c - 0.05) * 100) / 100;
  if (job.c < -0.001) {
    P.compassion.v = job.restore;
    model.applyCompassion();
    syncHero();
    sweepJob = null;
    document.getElementById('btn-sweep').classList.remove('on');
    dbg.info('sweep done', { points: sweepPoints.length });
    hold();
  }
}

function persist() {
  const out = { schema: SCHEMA, model: {}, election: {} };
  for (const k in P) out.model[k] = P[k].v;
  for (const k in EP) out.election[k] = EP[k].v;
  config.save(out);
}

function restore() {
  const saved = config.load();
  if (!saved) return;
  if (saved.schema !== SCHEMA) {
    config.clear();
    dbg.info('discarded a saved config from an older schema', { was: saved.schema ?? 'unversioned' });
    return;
  }
  for (const [params, stored] of [[P, saved.model], [EP, saved.election]]) {
    for (const k in stored ?? {}) {
      const p = params[k];
      if (!p) continue;
      const v = Number(stored[k]);
      if (Number.isFinite(v) && v >= p.min && v <= p.max) p.v = v;
    }
  }
  model.applyCompassion();
  syncHero();
  for (const [params, prefix] of [[P, 'x-'], [EP, 'x-']]) {
    for (const k in params) {
      const input = document.getElementById(prefix + k);
      if (input) { input.value = params[k].v; setLabel(k, params[k].v); }
    }
  }
}

function fmt(v) {
  return Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 1 ? v.toFixed(2) : v.toFixed(3);
}

let last = performance.now(), frameNo = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  requestAnimationFrame(frame);

  frameNo++;
  const drawEvery = Number(drawInput.value);
  const drawing = frameNo % drawEvery === 0;

  if (sweepJob) { advanceSweep(); if (drawing) view.drawNetwork(model); return; }
  if (paused) return;

  const steps = Number(speedInput.value);
  for (let k = 0; k < steps; k++) model.step();

  rate.steps += steps;
  rate.frames++;
  if (now - rate.since >= 1000) {
    const secs = (now - rate.since) / 1000;
    rate.stepsPerSec = Math.round(rate.steps / secs);
    rate.fps = Math.round(rate.frames / secs);
    rate.steps = 0; rate.frames = 0; rate.since = now;
  }

  if (drawing) view.drawNetwork(model);

  if (drawing) renderStats();

  sinceVote += dt;
  if (sinceVote >= ELECTION_EVERY) hold();
}
requestAnimationFrame(frame);

dbg.setMeta({ capacity: CAP });
dbg.info('ready');
</script>
</body>
</html>
